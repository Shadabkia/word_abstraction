<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a22"/>
      <stop offset="1" stop-color="#253047"/>
    </linearGradient>
    <style>
      .title{font:700 44px system-ui,-apple-system,Segoe UI,Roboto,Arial;fill:#fff}
      .small{font:500 24px system-ui,-apple-system,Segoe UI,Roboto,Arial;fill:#d8dee9}
      .label{font:600 28px system-ui,-apple-system,Segoe UI,Roboto,Arial;fill:#fff}
      .panel{fill:rgba(255,255,255,0.06);stroke:rgba(255,255,255,0.18);stroke-width:4}
      .tag{fill:rgba(0,0,0,0.35)}
    </style>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <text x="56" y="92" class="title">CH1L02 - Slide 4</text>
  <text x="56" y="140" class="small">The Weight of Listening</text>

  <rect x="56" y="200" rx="28" ry="28" width="968" height="380" class="panel"/>
  <rect x="56" y="620" rx="28" ry="28" width="968" height="404" class="panel"/>

  <text x="88" y="256" class="label">Panel 1</text>
  <text x="88" y="298" class="small">Kian grips wheel - shoulders tight - full</text>
  <rect x="88" y="332" rx="18" ry="18" width="860" height="64" class="tag"/>
  <text x="112" y="376" class="small">Listening takes space. Nobody checks if you have any left.</text>

  <text x="88" y="676" class="label">Panel 2</text>
  <text x="88" y="718" class="small">Passenger exits: Thanks, boss. Door closes.</text>
  <rect x="88" y="752" rx="18" ry="18" width="520" height="64" class="tag"/>
  <text x="112" y="796" class="small">They always leave lighter.</text>
</svg>
